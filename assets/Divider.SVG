<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff0000" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff0000" stop-opacity="1"/>
      <stop offset="1" stop-color="#ff0000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="360" y2="0">
      <stop offset="0" stop-color="#ff8a8a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff8a8a" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-360 0" to="1200 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-5%" y="-300%" width="110%" height="700%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect x="0" y="9" width="1200" height="6" fill="url(#fade)" filter="url(#glow)" opacity="0.8">
    <animate attributeName="opacity" values="0.55;0.95;0.55" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="10.5" width="1200" height="3" rx="1.5" fill="url(#fade)"/>
  <rect x="0" y="10.5" width="1200" height="3" rx="1.5" fill="url(#sweep)"/>
</svg>
